<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E6">
<title>三口食 · 扫码点单</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F1E6; --card:#FFFDF8; --ink:#2B211B; --ink-2:#5C4A3E; --muted:#94837A;
  --line:#EADFCC; --accent:#BF5626; --accent-2:#E8A25C; --soft:#F6E4D3;
  --dark:#2C2320; --ok:#3F7A55; --radius:16px;
}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(180,150,110,.16) 1px,transparent 1px);
  background-size:18px 18px; opacity:.5;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:inherit}
.shell{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.serif{font-family:"Noto Serif SC","Songti SC",serif}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:30;padding:14px 16px 10px;
  background:linear-gradient(180deg,rgba(247,241,230,.97),rgba(247,241,230,.9));backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(234,223,204,.8);}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .name{font-size:18px;letter-spacing:.04em;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .name em{font-style:normal;color:var(--accent);font-size:9.5px;letter-spacing:.16em;margin-left:5px;font-weight:500;vertical-align:2px}
.brand .sub{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.tools{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}
.tools button{font-size:11.5px;color:var(--ink-2);padding:6px 12px;border-radius:99px;white-space:nowrap;
  border:1px solid var(--line);background:#fff;letter-spacing:.04em}
.tools button:active{background:var(--soft)}
.notice{margin-top:11px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;overflow:hidden}
.notice .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.notice span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 菜单 */
.menu-wrap{display:flex;align-items:flex-start}
.rail{flex:0 0 86px;position:sticky;top:0;padding:12px 6px 120px 10px;display:flex;flex-direction:column;gap:2px}
.rail button{text-align:left;padding:11px 8px 11px 10px;border-radius:10px;font-size:12.5px;color:var(--ink-2);position:relative;line-height:1.25}
.rail button.active{color:var(--ink);font-weight:700;background:#fff}
.rail button.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--accent);border-radius:2px}
.rail button .cnt{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.list{flex:1;min-width:0;padding:10px 14px 140px 2px}
.cat-title{display:flex;align-items:baseline;gap:8px;margin:14px 0 10px;padding-left:2px}
.cat-title h2{margin:0;font-size:14px;letter-spacing:.06em}
.cat-title span{font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.goods{display:flex;gap:11px;padding:12px 0 14px;border-bottom:1px dashed var(--line)}
.goods:last-child{border-bottom:0}
.goods.out .info{opacity:.55}
.goods .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.goods .t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.goods .t h3{margin:0;font-size:14.5px;font-weight:600}
.tag{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--accent-2);color:var(--accent);line-height:1.5;flex:0 0 auto}
.goods .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goods .b{display:flex;align-items:center;gap:8px;margin-top:8px}
.price{font-size:16px;font-weight:700}
.price i{font-style:normal;font-size:11px;font-weight:500;margin-right:1px}
.sales{font-size:10.5px;color:var(--muted)}
.thumb{position:relative;flex:0 0 78px;height:78px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.thumb svg{width:64%;height:64%;opacity:.9}
.addbtn{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(191,86,38,.35);border:2px solid var(--card)}
.addbtn:active{transform:scale(.92)}
.soldtag{position:absolute;inset:0;background:rgba(44,35,32,.42);color:#fff;font-size:11px;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;border-radius:12px}

/* 购物车条 */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;
  background:linear-gradient(to top, var(--bg) 62%, rgba(250,244,235,0))}
.cartbar .inner{max-width:452px;margin:0 auto;pointer-events:auto;display:flex;align-items:center;gap:12px;
  background:var(--dark);color:#fff;border-radius:16px;padding:11px 12px 11px 16px;box-shadow:0 10px 26px rgba(44,35,32,.28)}
.cartbar.empty .inner{opacity:.92}
.cbadge{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cbadge svg{width:18px;height:18px}
.cbadge em{position:absolute;top:-5px;right:-5px;font-style:normal;min-width:17px;height:17px;border-radius:9px;background:var(--accent-2);
  color:#2C2320;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cartbar .sum{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.cartbar .sum b{font-size:17px;font-weight:700}
.cartbar .sum b i{font-style:normal;font-size:11px;font-weight:500;margin-right:2px}
.cartbar .sum small{font-size:10.5px;opacity:.6;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartbar .go{background:#fff;color:var(--dark);border-radius:11px;padding:9px 18px;font-size:13px;font-weight:700;flex:0 0 auto}
.cartbar.empty .go{background:rgba(255,255,255,.22);color:rgba(255,255,255,.7)}

/* 通用 */
.page{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.page-head h1{margin:0;font-size:16px;letter-spacing:.04em}
.page-head .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.block{margin-bottom:16px}
.block > .lbl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.06em;margin:0 0 8px 2px}
.block > .lbl em{font-style:normal;color:var(--accent);font-size:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink-2);
  display:flex;flex-direction:column;gap:2px;align-items:center}
.seg button small{font-size:10px;color:var(--muted)}
.seg button.on{border-color:var(--accent);background:var(--soft);color:var(--ink);font-weight:600}
.seg button.on small{color:var(--accent)}
.field{display:flex;align-items:center;gap:10px;margin-top:12px}
.field label{font-size:12.5px;color:var(--ink-2);flex:0 0 62px}
.field input{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;min-width:0}
.field input:focus{border-color:var(--accent-2)}
.card textarea{width:100%;border:0;background:transparent;outline:none;resize:none;height:56px;line-height:1.65;font-size:13px;padding:0}
.card textarea::placeholder{color:#B9ABA0}
.bill{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.bill .row{display:flex;gap:10px;padding:11px 14px;border-bottom:1px dashed var(--line);align-items:flex-start}
.bill .row:last-child{border-bottom:0}
.bill .row .nm{flex:1;min-width:0}
.bill .row .nm b{font-size:13.5px;font-weight:600;display:block}
.bill .row .nm small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.bill .row .pr{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bill .row .qty{font-size:11.5px;color:var(--muted);margin-left:6px}
.bill .total{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff}
.bill .total .t1{font-size:12px;color:var(--muted)}
.bill .total .t2{font-size:19px;font-weight:700}
.bill .total .t2 i{font-style:normal;font-size:11.5px;font-weight:500;margin-right:1px}
.discount{color:var(--accent);font-size:11.5px}
.primary{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;letter-spacing:.06em;
  box-shadow:0 8px 20px rgba(191,86,38,.26)}
.primary:active{transform:translateY(1px)}
.primary.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.primary:disabled{background:#D8CFC2;box-shadow:none;color:#fff}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}

/* 弹层 */
.mask{position:fixed;inset:0;z-index:50;background:rgba(35,26,20,.42);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:90vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet .hd{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{margin:0;font-size:15px;letter-spacing:.04em}
.sheet .hd p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
.sheet .hd .x{margin-left:auto;font-size:18px;color:var(--muted);padding:0 4px;line-height:1}
.sheet .bd{overflow-y:auto;padding:8px 18px 6px;-webkit-overflow-scrolling:touch}
.sheet .ft{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.spec-price{margin-left:auto;text-align:right}
.spec-price b{font-size:18px;font-weight:700}
.spec-price b i{font-style:normal;font-size:11px;font-weight:500}
.grp{padding:14px 0 4px;border-bottom:1px dashed var(--line)}
.grp:last-child{border-bottom:0}
.grp .g-name{font-size:12.5px;color:var(--ink-2);margin-bottom:9px;display:flex;gap:6px;align-items:center}
.grp .g-name em{font-style:normal;font-size:10px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink-2)}
.opts button small{font-size:10px;color:var(--muted);margin-left:4px}
.opts button.on{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.opts button.on small{color:var(--accent)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:32px;height:30px;font-size:16px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.stepper button:disabled{color:#CFC5B8}
.stepper span{min-width:30px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.spec-sum{font-size:11.5px;color:var(--muted);flex:1;line-height:1.45}
.crow{display:flex;gap:11px;padding:13px 0;border-bottom:1px dashed var(--line);align-items:center}
.crow:last-child{border-bottom:0}
.crow .nm{flex:1;min-width:0}
.crow .nm b{font-size:13.5px;font-weight:600}
.crow .nm small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.crow .p{font-size:13.5px;font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.empty-tip{padding:44px 20px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.empty-tip b{display:block;font-size:14px;color:var(--ink-2);margin-bottom:6px}

/* 成功页 */
.success{padding:34px 18px calc(40px + env(safe-area-inset-bottom));text-align:center}
.success .ring{width:76px;height:76px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.success .ring svg{width:34px;height:34px}
.success h1{margin:0 0 4px;font-size:19px;letter-spacing:.06em}
.success .pay{font-size:12.5px;color:var(--muted)}
.success .no{margin:18px auto 0;display:inline-flex;flex-direction:column;gap:2px;background:#fff;border:1px dashed var(--accent-2);border-radius:14px;padding:12px 26px}
.success .no small{font-size:10.5px;color:var(--muted);letter-spacing:.16em}
.success .no b{font-size:26px;letter-spacing:.1em;color:var(--accent)}
.success .eta{font-size:12px;color:var(--ink-2);margin-top:14px}
.steps{max-width:320px;margin:24px auto 0;display:flex;justify-content:space-between;position:relative}
.steps::before{content:"";position:absolute;left:22px;right:22px;top:9px;height:2px;background:var(--line)}
.steps i{position:absolute;left:22px;top:9px;height:2px;background:var(--accent);width:0;transition:width .4s}
.steps .st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);width:56px}
.steps .st .pt{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.steps .st.on{color:var(--ink)}
.steps .st.on .pt{border-color:var(--accent);background:var(--accent)}
.steps .st.on .pt::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}

/* 订单卡 */
.ocard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:11px}
.ocard .oh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ocard .oh b{font-size:13.5px;letter-spacing:.06em}
.ocard .oh .tm{font-size:10.5px;color:var(--muted)}
.ocard .oh .st{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.st-new{background:#FCEEDA;color:#A2611F}.st-making{background:#E7F1E5;color:#3F7A55}
.st-ready{background:#E4EEF7;color:#33648C}.st-done{background:#F0EBE3;color:#8A7B6F}
.st-cancel{background:#F7E7E4;color:#A6503F}
.ocard .body{font-size:11.5px;color:var(--ink-2);line-height:1.7}
.ocard .body .it{display:flex;justify-content:space-between;gap:10px}
.ocard .tot{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.ocard .tot span{font-size:11px;color:var(--muted)}
.ocard .tot b{margin-left:auto;font-size:15px}
.ocard .acts{display:flex;gap:8px;margin-top:10px}
.ocard .acts button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink-2)}
.ocard .acts button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* 后台 */
.stats{display:flex;gap:9px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:700}
.stat small{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.stat b i{font-style:normal;font-size:11px;font-weight:500;margin-right:1px}
.sec-t{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:16px 0 6px}
.sfield{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sfield label{flex:0 0 66px;font-size:12px;color:var(--ink-2)}
.sfield input,.sfield select{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;outline:none;font-size:12.5px}
.sfield input:focus,.sfield select:focus{border-color:var(--accent-2)}
.prow{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px dashed var(--line)}
.prow input{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;outline:none;font-size:12px;min-width:0}
.prow input.nm2{flex:1}
.prow input.pr2{width:54px;text-align:center}
.prow .yuan{font-size:11px;color:var(--muted);margin-left:-3px}
.iconbtn{flex:0 0 auto;font-size:11px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.soldbtn{font-size:10.5px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);flex:0 0 auto}
.soldbtn.on{background:#F7E7E4;border-color:#E7C6C0;color:#A6503F}
.soldbtn.off{background:#E7F1E5;border-color:#CFE0C9;color:#3F7A55}
.catbar{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.catbar b{font-size:13px;letter-spacing:.04em}
.catbar em{font-style:normal;font-size:10.5px;color:var(--muted)}
.catbar .sp{margin-left:auto;display:flex;gap:6px}
.tabbar{display:flex;gap:6px;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px}
.tabbar button{flex:1;padding:8px 4px;border-radius:8px;font-size:12px;color:var(--ink-2)}
.tabbar button.on{background:var(--soft);color:var(--accent);font-weight:700}
.rules-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:8px 0;border-bottom:1px dashed var(--line)}
.rules-row input{width:54px;border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:center;background:#fff;outline:none;font-size:12px}
.optrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.optrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12px;background:#fff;outline:none;min-width:0}
.optrow input.w{width:46px;flex:0 0 46px;text-align:center}
.optrow .del{font-size:14px;color:#C08B7C;padding:0 4px}
.mini{font-size:11px;color:var(--muted);text-decoration:underline}
.login{padding:60px 26px;text-align:center}
.login .logo{font-size:26px;letter-spacing:.1em;margin-bottom:6px}
.login .sub{font-size:11.5px;color:var(--muted);letter-spacing:.14em;margin-bottom:34px}
.login input{width:100%;text-align:center;letter-spacing:.4em;font-size:20px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.line{border:0;border-top:1px dashed var(--line);margin:14px 0}
/* 二级分类 */
.sub-title{display:flex;align-items:center;gap:7px;margin:16px 0 0;padding-bottom:6px;border-bottom:1px solid #F1E5D2}
.sub-title span{font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.sub-title em{font-style:normal;font-size:10px;color:var(--muted)}
.sub-title::before{content:"";width:3px;height:12px;background:var(--accent-2);border-radius:2px}
.subwrap{border-left:2px solid #F2E6D2;padding-left:10px;margin:8px 0 6px 2px}
.subbar{display:flex;align-items:center;gap:7px;margin:12px 0 2px}

        {id:"p19",n:"加午餐肉",d:"两片厚切",p:8,s:456,tag:"",set:"",tone:"a",icon:"food"},

/* ---------- 小工具 ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => (Number(n)%1===0 ? Number(n) : Number(n).toFixed(1));
const F = n => "¥"+money(n);
function toast(msg){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.classList.add("on"); clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("on"),1800);
}
function numOr0(v){ const n=parseFloat(v); return isNaN(n)?0:n }
function rid(pre){ return pre + Date.now().toString(36).slice(-4) + Math.floor(Math.random()*9) }
const SET_NAMES = {drink:"饮品规格", chicken:"炸鸡规格", noodle:"泡面规格"};

/* ---------- 配置读写 ---------- */
function normItem(it){
  let set = it.set===undefined ? (it.needSpec===false ? "" : "drink") : String(it.set||"");
  if(["drink","chicken","noodle",""].indexOf(set)<0) set="drink";
  return { id:String(it.id||rid("p")), n:String(it.n||"未命名"), d:String(it.d||""),
    p:numOr0(it.p), s:numOr0(it.s), tag:String(it.tag||""), set,
    tone:String(it.tone||"b"), icon:String(it.icon||"cup"), sold:!!it.sold,
    img: (typeof it.img==="string" && it.img.slice(0,5)==="data:") ? it.img : "" };
}
function normGroups(gs){
  return (gs||[]).map(g=>({ name:String(g.name||"规格"), note:String(g.note||""), multi:!!g.multi,
    opts:(g.opts||[]).map(o=>({n:String(o.n||""), d:numOr0(o.d)})) }));
}
function loadCfg(){
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(LS_CFG)||"null") }catch(e){}
  const c = clone(DEFAULT_CFG);
  if(!raw || typeof raw!=="object") return c;
  if(raw.shop) Object.assign(c.shop, raw.shop);
  if(Array.isArray(raw.rules) && raw.rules.length) c.rules = raw.rules.map(r=>({min:numOr0(r.min),off:numOr0(r.off)}));
  if(raw.sets && typeof raw.sets==="object"){
    Object.keys(c.sets).forEach(k=>{ if(Array.isArray(raw.sets[k]) && raw.sets[k].length) c.sets[k]=normGroups(raw.sets[k]) });
  }
  if(Array.isArray(raw.cats) && raw.cats.length){
    c.cats = raw.cats.map((ct,ci)=>{
      const subs = (Array.isArray(ct.subs) && ct.subs.length)
        ? ct.subs.map((sb,si)=>({ id:String(sb.id||("s"+ci+si)), sub:String(sb.sub||"未命名"),
            items:(sb.items||[]).map(normItem) }))
        : [{ id:"s"+ci+"0", sub:"常规", items:(ct.items||[]).map(normItem) }];
      return { id:String(ct.id||("c"+ci)), cat:String(ct.cat||"分类"), en:String(ct.en||""), subs };
    });
  }
  return c;
}
function saveCfgLocal(c){ try{ localStorage.setItem(LS_CFG, JSON.stringify(c)) }catch(e){} }
function saveCfg(c){
  try{ localStorage.setItem(LS_CFG, JSON.stringify(c)) }
  catch(e){ toast("保存失败：图片太多或太大，删掉几张再试") }
  pushCfg();
}
function resetCfg(){ try{ localStorage.removeItem(LS_CFG) }catch(e){} }
let CFG = loadCfg();

const SET = (()=>{ try{ return JSON.parse(localStorage.getItem(LS_SET)||"{}")||{} }catch(e){ return {} } })();
function saveSet(){ try{ localStorage.setItem(LS_SET, JSON.stringify(SET)) }catch(e){} }

/* ---------- 查询 ---------- */
function eachItem(fn){
  CFG.cats.forEach((ct,ci)=>ct.subs.forEach((sb,si)=>sb.items.forEach((it,ii)=>fn(it,ci,si,ii))));
}
function allItems(){
  const out=[]; eachItem((it,ci,si)=>out.push({...it, cat:CFG.cats[ci].cat, sub:CFG.cats[ci].subs[si].sub, ci, si})); return out;
}
function locate(id){
  for(let ci=0;ci<CFG.cats.length;ci++){
    const ct=CFG.cats[ci];
    for(let si=0;si<ct.subs.length;si++){
      const idx=ct.subs[si].items.findIndex(x=>x.id===id);
      if(idx>=0) return {ci,si,idx,item:ct.subs[si].items[idx]};
    }
  }
  return null;
}
function findItem(id){ const l=locate(id); return l?{...l.item, cat:CFG.cats[l.ci].cat, sub:CFG.cats[l.ci].subs[l.si].sub}:null }
function itemCount(){ let n=0; eachItem(()=>n++); return n }
function catCount(ct){ return ct.subs.reduce((a,s)=>a+s.items.length,0) }
function groupsFor(it){
  const key = String((it && it.set)||"");
  if(key && CFG.sets[key]) return CFG.sets[key];
  return [];
}

/* ---------- 购物车 ---------- */
function loadCart(){ try{ const v=JSON.parse(localStorage.getItem(LS_CART)||"[]"); return Array.isArray(v)?v:[] }catch(e){ return [] } }
function saveCart(){ try{ localStorage.setItem(LS_CART, JSON.stringify(cart)) }catch(e){} }
let cart = loadCart();

function addToCart(it){
  const same = cart.find(c=>c.key===it.key);
  if(same) same.qty += it.qty; else cart.push(it);
  saveCart();
}
function cartCount(){ return cart.reduce((a,b)=>a+b.qty,0) }
function cartSub(){ return cart.reduce((a,b)=>a+b.unit*b.qty,0) }
function discountFor(amount){
  const rules = CFG.rules.slice().sort((a,b)=>b.min-a.min);
  for(const r of rules){ if(amount >= r.min && r.off>0) return r.off }
  return 0;
}
function payTotal(){ return Math.max(0, cartSub()-discountFor(cartSub())) }

/* ---------- 规格 ---------- */
function specInit(groups){ return groups.map(g=> g.multi ? [] : 0) }
function specUnit(base, sel, groups){
  let u = base;
  groups.forEach((g,gi)=>{
    if(g.multi){ (sel[gi]||[]).forEach(i=> u += numOr0(g.opts[i] && g.opts[i].d)) }
    else { const o=g.opts[sel[gi]]; if(o) u += numOr0(o.d) }
  });
  return u;
}
function specLabel(sel, groups){
  const parts=[];
  groups.forEach((g,gi)=>{
    if(g.multi){ (sel[gi]||[]).forEach(i=>{ if(g.opts[i]) parts.push(g.opts[i].n) }) }
    else { const o=g.opts[sel[gi]]; if(o) parts.push(String(o.n).replace(/\s.*/,"")) }
  });
  return parts.join(" / ") || "标准";
}

/* ---------- 订单 ---------- */
function loadOrders(){ try{ const v=JSON.parse(localStorage.getItem(LS_ORD)||"[]"); return Array.isArray(v)?v:[] }catch(e){ return [] } }
function saveOrders(){ try{ localStorage.setItem(LS_ORD, JSON.stringify(orders)) }catch(e){} }
function saveOrdersLocal(){ try{ localStorage.setItem(LS_ORD, JSON.stringify(orders)) }catch(e){} }
let orders = loadOrders();

function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") }
function orderNo(){
  const live = orders.filter(o=>["new","making","ready"].includes(o.status)).length;
  return "A" + String(1 + (orders.length + live) % 900).padStart(3,"0");
}
function statusText(s){ return {new:"待接单",making:"制作中",ready:"可取餐",done:"已完成",cancel:"已取消"}[s]||s }
function statusClass(s){ return "st-"+s }
function orderCard(o, admin){
  const items = o.items.map(it=>`<div class="it"><span>${esc(it.name)}${it.spec?` · ${esc(it.spec)}`:""}</span><span>×${it.qty}</span></div>`).join("");
  const acts = admin ? adminActions(o) : "";
  return `<div class="ocard">
    <div class="oh"><b>${esc(o.no)}</b><span class="tm">${esc(o.time)}</span>
      <span class="st ${statusClass(o.status)}">${statusText(o.status)}</span></div>
    <div class="body">${items}
      <div style="margin-top:6px;color:var(--muted)">
        ${o.mode==="table"?`堂食 · ${esc(o.table)} 号桌`:`自取 · 尾号 ${esc(o.phone)}`}
        ${o.note?` · 备注：${esc(o.note)}`:""}
      </div>
    </div>
    <div class="tot"><span>${o.items.reduce((a,b)=>a+b.qty,0)} 件${o.off?` · 满减已减 ${F(o.off)}`:""}</span><b>${F(o.total)}</b></div>
    ${acts}
  </div>`;
}
/* ---------- 云端同步（Supabase REST） ---------- */
const CLOUD_SQL = "create table if not exists public.sk_config (id text primary key, data jsonb not null, updated_at timestamptz default now()); create table if not exists public.sk_orders (id text primary key, data jsonb not null, ts bigint, created_at timestamptz default now()); grant all on public.sk_config to anon; grant all on public.sk_orders to anon; alter table public.sk_config enable row level security; alter table public.sk_orders enable row level security; drop policy if exists anon_all_cfg on public.sk_config; drop policy if exists anon_all_ord on public.sk_orders; create policy anon_all_cfg on public.sk_config for all to anon using (true) with check (true); create policy anon_all_ord on public.sk_orders for all to anon using (true) with check (true);";

let CLOUD_ST = "off";
let CLOUD_ERR = "";
function normUrl(u){ return String(u||"").trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"") }
function cloudOf(){
  const s = SET.cloud;
  if(s && s.url && s.key) return { url:normUrl(s.url), key:String(s.key).trim() };
  if(CLOUD_CONF.url && CLOUD_CONF.key && CLOUD_CONF.url.indexOf("__")!==0)
    return { url:normUrl(CLOUD_CONF.url), key:String(CLOUD_CONF.key).trim() };
  return null;
}
function cBase(){ const c=cloudOf(); return c ? c.url : "" }
function cHead(extra){
  const c = cloudOf();
  const k = c ? c.key : "";
  const h = { apikey:k, "Content-Type":"application/json" };
  if(k.indexOf("sb_publishable_") !== 0) h.Authorization = "Bearer " + k;
  return Object.assign(h, extra||{});
}
async function apiGet(path){
  const r = await fetch(cBase()+"/rest/v1/"+path, {headers:cHead()});
  if(!r.ok) throw new Error("HTTP "+r.status+" "+String(await r.text()).slice(0,160));
  return await r.json();
}
async function apiPost(path, body){
  const r = await fetch(cBase()+"/rest/v1/"+path, {method:"POST",
    headers:cHead({"Prefer":"resolution=merge-duplicates,return=minimal"}), body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status+" "+String(await r.text()).slice(0,140));
  return true;
}
let pushTimer = null;
function pushCfg(){
  if(!cloudOf()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async ()=>{
    try{ await apiPost("sk_config?on_conflict=id", [{id:"main", data:CFG}]); CLOUD_ST="ok" }
    catch(e){ CLOUD_ST="error"; CLOUD_ERR=String(e.message||e); console.warn(e) }
  }, 700);
}
async function pullCfg(){
  if(!cloudOf()) return false;
  try{
    const rows = await apiGet("sk_config?id=eq.main&select=data");
    CLOUD_ST="ok";
    if(!rows || !rows[0] || !rows[0].data){ pushCfg(); return false }
    const txt = JSON.stringify(rows[0].data);
    if(txt !== JSON.stringify(CFG)){ saveCfgLocal(rows[0].data); CFG = loadCfg(); return true }
    return false;
  }catch(e){ CLOUD_ST="error"; CLOUD_ERR=String(e.message||e); console.warn(e); return false }
}
async function pushOrder(o){
  if(!cloudOf()) return;
  try{ await apiPost("sk_orders?on_conflict=id", [{id:o.no, data:o, ts:o.ts}]); CLOUD_ST="ok" }
  catch(e){ CLOUD_ST="error"; CLOUD_ERR=String(e.message||e); console.warn(e) }
}
async function pullOrders(){
  if(!cloudOf()) return false;
  try{
    const rows = await apiGet("sk_orders?select=data&order=ts.desc&limit=200");
    const list = (rows||[]).map(r=>r.data).filter(Boolean);
    if(list.length || orders.length===0){ orders = list; saveOrdersLocal(); CLOUD_ST="ok"; return true }
    return false;
  }catch(e){ CLOUD_ST="error"; CLOUD_ERR=String(e.message||e); console.warn(e); return false }
}
async function selfCheck(){
  const c = cloudOf();
  if(!c){ toast("先填 Project URL 和 anon key"); return }
  const lines = ["地址：" + c.url, "key：" + String(c.key).slice(0,14) + "…"];
  for(const t of ["sk_config","sk_orders"]){
    try{
      const r = await fetch(c.url+"/rest/v1/"+t+"?select=*&limit=1", {headers:cHead()});
      if(r.ok) lines.push(t + "：正常（HTTP " + r.status + "）");
      else {
        const b = String(await r.text()).slice(0,180);
        lines.push(t + "：HTTP " + r.status + "  " + b);
      }
    }catch(e){ lines.push(t + "：请求失败 " + String(e.message||e).slice(0,120)) }
  }
  lines.push("");
  lines.push("404 = 表没建（去 SQL Editor 跑建表语句）；401/403 = key 填错或 RLS 没放行；Failed to fetch = 网络/域名不对");
  askConfirm("云端自检", lines.join("\n"), ()=>{} , "关闭");
}
function cloudLabel(){
  if(!cloudOf()) return "未连云端";
  return CLOUD_ST==="error" ? "云端异常" : "云端已同步";
}


/* ---------------- 视图状态 ---------------- */
const state = { view:"menu", cat:0, sheet:null, spec:null, ck:{mode:"self",table:"",phone:"",note:""}, last:null };

/* ---------------- 图形 ---------------- */
const TONES = {
  a:"linear-gradient(145deg,#F3DDBF,#E7BE8C)", b:"linear-gradient(145deg,#EFE6D2,#DCCFB2)",
  c:"linear-gradient(145deg,#E4D6CB,#C9B0A0)", d:"linear-gradient(145deg,#EFD9DE,#DDB6C1)",
  e:"linear-gradient(145deg,#DEE7D5,#C2D3B4)", f:"linear-gradient(145deg,#FBE2BE,#F0C480)"
};
const ICONS = {
  cup:`<svg viewBox="0 0 64 64" fill="none" stroke="#5B3A24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M15 22h30l-4.2 29a5 5 0 0 1-4.9 4.2h-11.8a5 5 0 0 1-4.9-4.2z" stroke-linecap="round"/>
    <path d="M11 22h38" stroke-linecap="round"/><path d="M12.6 22c1.6-4.4 9.4-7.4 17.4-7.4s15.8 3 17.4 7.4"/>
    <path d="M38 9.5c2.4 3.6 3 7.6 2.6 12" stroke-dasharray="3 4" stroke-linecap="round"/>
    <path d="M22 32h16M22 38h11" stroke="#8A6446" stroke-width="1.6" opacity=".7"/></svg>`,
  coffee:`<svg viewBox="0 0 64 64" fill="none" stroke="#5B3A24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M13 25h30v14a11 11 0 0 1-11 11H24a11 11 0 0 1-11-11z"/><path d="M43 29h5a5.5 5.5 0 0 1 0 11h-5" stroke-linecap="round"/>
    <path d="M11 54h36" stroke-linecap="round"/></svg>`,
  food:`<svg viewBox="0 0 64 64" fill="none" stroke="#5B3A24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M18 38c0-8 6.3-14 14-14s14 6 14 14" stroke-linecap="round"/>
    <path d="M13 38h38M15 45h34" stroke-linecap="round"/></svg>`
};
function thumb(p){
  return `<div class="thumb" style="background:${TONES[p.tone]||TONES.b}">
    ${p.img ? `<img class="pimg" src="${p.img}" alt="">` : (ICONS[p.icon]||ICONS.cup)}
    ${p.sold ? `<div class="soldtag">售罄</div>` : `<button class="addbtn" onclick="openItem('${p.id}')">＋</button>`}
  </div>`;
}

/* ---------------- 菜单 ---------------- */
function renderTop(){
  return `<div class="topbar">
    <div class="brand-row">
      <div class="brand">
        <div class="name serif">${esc(CFG.shop.name)}<em>${esc(CFG.shop.en)}</em></div>
        <div class="sub">${esc(CFG.shop.sub)} · ${esc(CFG.shop.pickTime)}</div>
      </div>
    </div>
    <div class="tools"><button onclick="go('orders')">我的订单</button></div>
    <div class="notice"><span class="dot"></span><span>${esc(CFG.shop.notice)}</span></div>
  </div>`;
}
function renderMenu(){
  if(state.cat >= CFG.cats.length) state.cat = 0;
  const cat = CFG.cats[state.cat];
  const rail = CFG.cats.map((c,i)=>`<button class="${i===state.cat?'active':''}" onclick="pickCat(${i})">
      ${esc(c.cat)}<span class="cnt">${catCount(c)} 款</span></button>`).join("");

  const body = cat.subs.map(sb=>`
    <div class="sub-title"><span>${esc(sb.sub)}</span><em>${sb.items.length} 款</em></div>
    ${sb.items.length ? sb.items.map(p=>`
    <div class="goods ${p.sold?'out':''}">
      <div class="info">
        <div>
          <div class="t"><h3>${esc(p.n)}</h3>${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}</div>
          <div class="d">${esc(p.d)}</div>
        </div>
        <div class="b"><span class="price"><i>¥</i>${money(p.p)}</span><span class="sales">月售 ${p.s}</span></div>
      </div>
      ${thumb(p)}
    </div>`).join("") : `<div class="hint" style="text-align:left;color:var(--muted);padding:6px 0 10px">这个子类目还没上架商品</div>`}
  `).join("");

  return `${renderTop()}
  <div class="menu-wrap">
    <div class="rail">${rail}</div>
    <div class="list">
      <div class="cat-title"><h2 class="serif">${esc(cat.cat)}</h2><span>${esc(cat.en)}</span></div>
      ${body}
    </div>
  </div>`;
}

/* ---------------- 购物车条 ---------------- */
function renderCartBar(){
  if(state.view!=="menu") return "";
  const n=cartCount(), total=payTotal();
  const rule = CFG.rules.slice().sort((a,b)=>a.min-b.min)[0];
  return `<div class="cartbar ${n===0?'empty':''}">
    <div class="inner" onclick="openCart()">
      <div class="cbadge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 4h2.2l2.2 11h11l2-8H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17.5" cy="19" r="1.4"/>
        </svg>
        ${n>0?`<em>${n}</em>`:""}
      </div>
      <div class="sum"><b><i>¥</i>${money(total)}</b>
        <small>${n>0?`已选 ${n} 件${rule?` · 满 ${rule.min} 减 ${rule.off}`:""}`:"还没选，点商品旁的＋"}</small></div>
      <div class="go" onclick="event.stopPropagation();${n>0?"go('checkout')":"toast('先选一份再结算')"}">去结算</div>
    </div>
  </div>`;
}

/* ---------------- 商品 -> 规格 ---------------- */
function openItem(id){
  const p=findItem(id); if(!p) return;
  if(p.sold){ toast("这份今天已经卖完了"); return }
  const groups = groupsFor(p);
  if(!groups.length){
    addToCart({key:p.id, pid:p.id, name:p.n, unit:p.p, qty:1, spec:""});
    toast(`已加入 ${p.n}`); render(); return;
  }
  state.spec = { pid:id, sel: specInit(groups), qty:1 };
  state.sheet = {type:"spec"};
  render();
}
function curSpec(){
  const p=findItem(state.spec.pid);
  return { p, groups: groupsFor(p) };
}
function renderSpecSheet(){
  if(!state.sheet || state.sheet.type!=="spec") return "";
  const {p, groups} = curSpec();
  if(!p) return "";
  const body = groups.map((g,gi)=>{
    const opts = g.opts.map((o,oi)=>{
      const on = g.multi ? state.spec.sel[gi].includes(oi) : state.spec.sel[gi]===oi;
      return `<button class="${on?'on':''}" onclick="pickSpec(${gi},${oi})">${esc(o.n)}${o.d?`<small>+${o.d}</small>`:""}</button>`;
    }).join("");
    return `<div class="grp"><div class="g-name">${esc(g.name)}<em>${esc(g.note)}</em></div><div class="opts">${opts}</div></div>`;
  }).join("");
  return `<div class="mask on" onclick="closeSheet()"></div>
  <div class="sheet on">
    <div class="hd">
      ${p.img?`<img class="hdimg" src="${p.img}" alt="">`:""}
      <div style="min-width:0"><h2>${esc(p.n)}</h2><p>${esc(p.d)}</p></div>
      <button class="x" onclick="closeSheet()">✕</button>
    </div>
    <div class="bd">${body}
      <div class="grp" style="display:flex;align-items:center;gap:10px;padding-bottom:14px">
        <div class="g-name" style="margin:0">数量</div>
        <div class="stepper" style="margin-left:auto">
          <button onclick="specQty(-1)" ${state.spec.qty<=1?"disabled":""}>−</button>
          <span>${state.spec.qty}</span><button onclick="specQty(1)">＋</button>
        </div>
      </div>
    </div>
    <div class="ft">
      <div class="spec-sum">${esc(specLabel(state.spec.sel, groups))}</div>
      <div class="spec-price"><b><i>¥</i>${money(specUnit(p.p,state.spec.sel,groups)*state.spec.qty)}</b></div>
      <button class="primary" style="width:auto;padding:12px 22px" onclick="confirmSpec()">加入购物车</button>
    </div>
  </div>`;
}
function pickSpec(gi,oi){
  const {groups} = curSpec();
  const g = groups[gi];
  if(g.multi){ const a=state.spec.sel[gi]; const i=a.indexOf(oi); if(i>=0) a.splice(i,1); else a.push(oi) }
  else state.spec.sel[gi]=oi;
  render();
}
function specQty(d){ state.spec.qty=Math.max(1,Math.min(20,state.spec.qty+d)); render() }
function confirmSpec(){
  const {p, groups} = curSpec();
  const sel=state.spec.sel;
  const unit=specUnit(p.p, sel, groups), spec=specLabel(sel, groups);
  addToCart({key:p.id+"|"+spec, pid:p.id, name:p.n, unit, qty:state.spec.qty, spec});
  state.sheet=null; state.spec=null; toast("已加入购物车"); render();
}

/* ---------------- 购物车弹层 ---------------- */
function openCart(){ if(cartCount()===0){ toast("购物车还是空的"); return } state.sheet={type:"cart"}; render() }
function closeSheet(){ state.sheet=null; state.spec=null; render() }
function changeQty(key,d){
  const it=cart.find(c=>c.key===key); if(!it) return;
  it.qty+=d; if(it.qty<=0) cart=cart.filter(c=>c.key!==key);
  saveCart(); render();
}
function clearCart(){ cart=[]; saveCart(); state.sheet=null; render(); toast("购物车已清空") }
function renderCartSheet(){
  if(!state.sheet || state.sheet.type!=="cart") return "";
  const rows=cart.map(c=>`<div class="crow">
      <div class="nm"><b>${esc(c.name)}</b><small>${esc(c.spec||"标准")}</small></div>
      <div class="p">${F(c.unit*c.qty)}</div>
      <div class="stepper"><button onclick="changeQty('${c.key}',-1)">−</button><span>${c.qty}</span>
        <button onclick="changeQty('${c.key}',1)">＋</button></div>
    </div>`).join("");
  const sub=cartSub(), off=discountFor(sub);
  return `<div class="mask on" onclick="closeSheet()"></div>
  <div class="sheet on">
    <div class="hd"><div><h2>已选</h2><p>共 ${cartCount()} 件</p></div><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="bd">${rows}<div style="padding:12px 0 18px">
      <button class="mini" onclick="clearCart()">清空购物车</button></div></div>
    <div class="ft">
      <div class="spec-sum">小计 ${F(sub)}${off?` · <span class="discount">已减 ${F(off)}</span>`:""}</div>
      <div class="spec-price"><b><i>¥</i>${money(Math.max(0,sub-off))}</b></div>
      <button class="primary" style="width:auto;padding:12px 18px" onclick="go('checkout')">去结算</button>
    </div>
  </div>`;
}

/* ---------------- 结算 ---------------- */
function renderCheckout(){
  const rows=cart.map(c=>`<div class="row"><div class="nm"><b>${esc(c.name)}</b><small>${esc(c.spec||"标准")}</small></div>
      <div class="pr">${F(c.unit)}<span class="qty">×${c.qty}</span></div></div>`).join("");
  const sub=cartSub(), off=discountFor(sub), total=Math.max(0,sub-off), ck=state.ck;
  return `<div class="page">
    <div class="page-head"><button class="back" onclick="go('menu')">‹</button><h1>确认订单</h1>
      <span class="cnt">${cartCount()} 件</span></div>
    <div class="block"><div class="lbl">取餐方式 <em>必选</em></div>
      <div class="seg">
        <button class="${ck.mode==='self'?'on':''}" onclick="setMode('self')">到店自取 <small>${esc(CFG.shop.pickTime)}</small></button>
        <button class="${ck.mode==='table'?'on':''}" onclick="setMode('table')">堂食送桌 <small>填桌号，送到桌</small></button>
      </div>
      ${ck.mode==='table'
        ? `<div class="field"><label>桌号</label><input value="${esc(ck.table)}" placeholder="例如 A05" maxlength="8" oninput="state.ck.table=this.value"></div>`
        : `<div class="field"><label>手机尾号</label><input value="${esc(ck.phone)}" placeholder="4 位数字，叫号用" inputmode="numeric" maxlength="4" oninput="state.ck.phone=this.value.replace(/\D/g,'')"></div>`}
    </div>
    <div class="block"><div class="lbl">订单明细 <em>${esc(CFG.shop.name)}</em></div>
      <div class="bill">${rows}
        <div class="total"><span class="t1">${off?`已享满减 ${F(off)}`:"未达满减门槛"}</span>
          <span class="t2"><i>¥</i>${money(total)}</span></div>
      </div>
    </div>
    <div class="block"><div class="lbl">备注</div>
      <div class="card" style="padding:12px"><textarea placeholder="例如：炸鸡切块 / 奶茶去冰 / 多加酱" oninput="state.ck.note=this.value">${esc(ck.note)}</textarea></div></div>
    <div class="block" style="margin-top:22px">
      <button class="primary" onclick="submitOrder()">提交订单 · ${F(total)}</button>
      <div class="hint">提交后店员在后台接单，可在「我的订单」看进度</div>
    </div>
  </div>`;
}
function setMode(m){ state.ck.mode=m; render() }

function submitOrder(){
  if(cart.length===0){ toast("购物车是空的"); return }
  const ck=state.ck;
  if(ck.mode==="table" && !String(ck.table).trim()){ toast("请填写桌号"); return }
  if(ck.mode==="self" && !/^\d{4}$/.test(ck.phone||"")){ toast("请填写 4 位手机尾号"); return }
  const sub=cartSub(), off=discountFor(sub), total=Math.max(0,sub-off);
  const order={ no:orderNo(), time:nowTime(), ts:Date.now(),
    items:cart.map(c=>({name:c.name,spec:c.spec,unit:c.unit,qty:c.qty})),
    sub, off, total, mode:ck.mode,
    table:ck.mode==="table"?String(ck.table).trim():"",
    phone:ck.mode==="self"?ck.phone:"",
    note:ck.note, status:"new" };
  orders.unshift(order); state.last=order;
  cart=[]; state.ck={mode:"self",table:"",phone:"",note:""};
  saveCart(); saveOrders(); pushOrder(order); state.view="success"; render();
}

/* ---------------- 成功 / 我的订单 ---------------- */
function statusIndex(s){ return s==="making"?1 : (s==="ready"||s==="done")?2 : 0 }
function renderSuccess(){
  const o=(state.last && orders.find(x=>x.no===state.last.no)) || state.last;
  if(!o) return `<div class="page"><div class="empty-tip"><b>还没有下单</b>返回菜单挑一份吧</div>
    <button class="primary ghost" onclick="go('menu')">回到菜单</button></div>`;
  const idx=statusIndex(o.status);
  const labels=["已下单","制作中","可取餐"];
  return `<div class="success">
    <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#BF5626" stroke-width="2.4" stroke-linecap="round"><path d="M4 12.5l5.2 5.2L20 6.8"/></svg></div>
    <h1 class="serif">下单成功</h1>
    <div class="pay">已通知店员，${o.mode==='table'?`送至 ${esc(o.table)} 号桌`:`凭尾号 ${esc(o.phone)} 取餐`}</div>
    <div class="no"><small>取餐号</small><b>${esc(o.no)}</b></div>
    <div class="eta">${esc(CFG.shop.pickTime)} · 共 ${o.items.reduce((a,b)=>a+b.qty,0)} 件 · ${F(o.total)}</div>
    <div class="steps"><i style="width:${idx===0?0:idx===1?50:100}%"></i>
      ${labels.map((l,i)=>`<div class="st ${i<=idx?'on':''}"><div class="pt"></div>${l}</div>`).join("")}</div>
    <div style="max-width:340px;margin:26px auto 0;display:flex;flex-direction:column;gap:10px">
      <button class="primary" onclick="go('menu')">继续点单</button>
      <button class="primary ghost" onclick="go('orders')">查看我的订单</button>
    </div>
  </div>`;
}
function renderOrders(){
  orders = loadOrders();
  const list=orders;
  return `<div class="page">
    <div class="page-head"><button class="back" onclick="go('menu')">‹</button><h1>我的订单</h1>
      <span class="cnt">${list.length} 单</span></div>
    ${list.length ? list.map(o=>orderCard(o,false)).join("") : `<div class="empty-tip"><b>还没有订单</b>点一份试试，下单后会出现在这里</div>`}
  </div>`;
}

/* ---------------- 路由 ---------------- */
function go(v){ state.view=v; state.sheet=null; state.spec=null; window.scrollTo(0,0); render() }
function pickCat(i){ state.cat=i; render() }
function render(){
  let body="";
  if(state.view==="menu") body=renderMenu()+renderCartBar();
  else if(state.view==="checkout") body=renderCheckout();
  else if(state.view==="success") body=renderSuccess();
  else if(state.view==="orders") body=renderOrders();
  let sheet="";
  if(state.sheet && state.sheet.type==="spec") sheet=renderSpecSheet();
  if(state.sheet && state.sheet.type==="cart") sheet=renderCartSheet();
  $("#shell").innerHTML = body+sheet;
  document.body.style.overflow = state.sheet ? "hidden" : "";
}


async function boot(){
  if(cloudOf()){ await pullCfg(); await pullOrders(); CFG = loadCfg(); orders = loadOrders(); }
  render();
}
window.addEventListener("storage", function(e){
  if(e.key === LS_CFG || e.key === LS_ORD){ CFG = loadCfg(); orders = loadOrders(); render(); }
});
window.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible" && cloudOf()) boot(); });
setInterval(async function(){
  if(!cloudOf() || document.visibilityState !== "visible") return;
  if(state.spec || state.sheet || state.view !== "menu") return;
  const ch = await pullCfg();
  if(ch){ CFG = loadCfg(); render() }
}, 8000);
boot();

</script>
